  > Running on macOS — the app isn't code-signed, so Gatekeeper quarantines it on first launch. After dragging Noctis into your Applications folder, clear the flag once in Terminal:
  >
  > xattr -dr com.apple.quarantine /Applications/Noctis.app
  >
  > Then open Noctis normally.
  What's Changed
  Fixed
  - Fixed lrc.red translations and romaji not showing
  - Fixed gaps between words in Chinese and Japanese word-synced lyrics
  - Fixed duet credits not matching online lyrics
  - Fixed lrc.red showing a connection error when it was only busy
  - Fixed Search Lyrics rows being read incorrectly by screen readers
  - Fixed Lyrics Studio mislabeling saved lyrics
  - Fixed Settings crashing on Apple Silicon
  - Fixed wrong button shapes and missing slider tracks in Settings on Mac
  - Fixed black screen when opening the mini player from macOS full screen
  - Fixed mini player crash when switching designs on Mac
  - Fixed startup crashes on Apple Silicon while decoding artwork
  - Fixed songs being skipped during library scans
  - Fixed launch-at-login switch staying on after a failed registration
  - Fixed Copy image on Mac and Linux not reaching the clipboard
  - Fixed dialog dim layer staying behind when the window moves on Mac
  - Fixed "Open in" not accepting Mac apps
  - Fixed smart playlist tiles showing zero tracks
  - Fixed sidebar highlight not following shortcuts or the command palette
  - Fixed Settings search finding Windows-only options on Mac
  Added
  - Added word-synced lyrics from lrc.red on the lyrics page
  - Added word-synced lyrics from lrc.red in Search Lyrics
  - Added lrc.red sync in Lyrics Studio
  - Added lrc.red credit under lyrics
  - Added Dock menu with Play/Pause, Next, Previous and Favorite on Mac
  - Added Control Center time display that follows playback speed
  - Added Command key shortcuts on Mac for selection and search
  - Added Mac delete key for removing queue rows
  - Added Control-Command-F for full screen on Mac
  - Added Homebrew and MacPorts ffmpeg detection on Mac
  Improved
  - Improved lrc.red lookups to run once per song
  - Improved lrc.red busy handling with a retry
  - Improved lrc.red setting hint
  - Improved Mac tooltips and wording for shortcuts
  - Improved Mac monospace font
  - Improved Settings and Appearance layout on Mac and Linux
